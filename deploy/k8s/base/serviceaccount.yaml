apiVersion: v1
kind: ServiceAccount
metadata:
  name: vrt-cell-controller
  namespace: openflare-system
  labels:
    app.kubernetes.io/part-of: openflare-control
automountServiceAccountToken: true
---
# vrt-host gets NO API access: it must not read or mutate cluster
# state — identity comes from signed desired only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vrt-host
  namespace: openflare-system
  labels:
    app.kubernetes.io/part-of: openflare-control
automountServiceAccountToken: false
