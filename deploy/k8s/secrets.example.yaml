# Secret EXAMPLE — NOT part of any kustomization (RV-R25). Applying a
# placeholder Secret with the base would overwrite the operator's real
# one and services would boot with REPLACE_ME. Operators create the real
# Secret out-of-band (doc/platform/workers-runtime-deploy.md §4); every
# HMAC/auth secret must be >= 32 bytes and not a placeholder — services
# fail closed otherwise. This file only documents names and keys.
# Required keys:
#   cell-token        — scoped vrt.cell-controller token (admin API)
#   kvrocks-url       — redis:// URL for vrt-provider KV backend
#   s3-access-key     — S3 access key for cell placement state + vrt-sql persistence
#   s3-secret-key     — S3 secret key for cell placement state + vrt-sql persistence
#   r2-binding-access-key — access key for the R2 binding store (provider [s3] +
#                       cell-controller [storage_purge.s3]); scope it to the binding bucket
#   r2-binding-secret-key — secret key for the R2 binding store
#   vrt-sql-auth-secret — service auth secret shared provider↔vrt-sql
#   vrt-sql-bookmark-secret — vrt-sql pagination bookmark HMAC (32B)
#   cursor-secret     — provider list-cursor HMAC secret (random 32B)
# Optional keys (feature is simply off when absent — never half-wired):
#   cache-purge-token — Workers Cache purge shared token (random 32B+):
#                       vrt-host mounts /internal/cache/purge only when set,
#                       cell-controller signs CACHE_PURGE fan-out with it
apiVersion: v1
kind: Secret
metadata:
  name: vrt-secrets
  namespace: openflare-system
  labels:
    app.kubernetes.io/part-of: openflare-control
type: Opaque
stringData:
  cell-token: 'REPLACE_ME'
  kvrocks-url: 'REPLACE_ME'
  s3-access-key: 'REPLACE_ME'
  s3-secret-key: 'REPLACE_ME'
  r2-binding-access-key: 'REPLACE_ME'
  r2-binding-secret-key: 'REPLACE_ME'
  vrt-sql-auth-secret: 'REPLACE_ME'
  vrt-sql-bookmark-secret: 'REPLACE_ME'
  cursor-secret: 'REPLACE_ME'
  cache-purge-token: 'REPLACE_ME'
