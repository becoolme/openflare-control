# Minimal plane-on-kind deployment for e2e. This is deliberately smaller than
# the production cell overlay: it proves the plane image, k8s Service/Deployment,
# Secret wiring and port-forward path, not a full workerd cell.
apiVersion: v1
kind: Namespace
metadata:
  name: openflare-plane-e2e
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openflare-plane-e2e
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: openflare-plane-e2e
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: vrt }
            - { name: POSTGRES_PASSWORD, value: vrt }
            - { name: POSTGRES_DB, value: vrt_plane }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ['pg_isready', '-U', 'vrt', '-d', 'vrt_plane'] }
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: plane
  namespace: openflare-plane-e2e
spec:
  selector: { app: plane }
  ports: [{ name: http, port: 8787, targetPort: 8787 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane
  namespace: openflare-plane-e2e
spec:
  replicas: 1
  selector: { matchLabels: { app: plane } }
  template:
    metadata: { labels: { app: plane } }
    spec:
      containers:
        - name: plane
          image: openflare-plane:e2e
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: plane-env }
          env:
            - { name: PLANE_BUNDLE_DIR, value: /data/bundles }
            - { name: PORT, value: '8787' }
          ports: [{ name: http, containerPort: 8787 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: bundles, mountPath: /data/bundles }
      volumes:
        - name: bundles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: openflare-plane-e2e
spec:
  selector: { app: console }
  ports: [{ name: http, port: 8788, targetPort: 8788 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: openflare-plane-e2e
spec:
  replicas: 1
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      containers:
        - name: console
          image: openflare-console:e2e
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: plane-env }
          env:
            - { name: PLANE_URL, value: 'http://plane:8787' }
            - { name: PORT, value: '8788' }
          ports: [{ name: http, containerPort: 8788 }]
          readinessProbe:
            httpGet: { path: /console-healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 2
