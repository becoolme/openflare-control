# cell-controller — desired pull/ack, envelope+assignment delivery,
# render-inputs materialization, cron leadership (all-in-one docker).
cell_id = "__CELL_ID__"
# The plane-loopback socat sidecar shares vrt-host's netns — which is
# also this container's netns — so 127.0.0.1:8787 reaches the plane.
# Needed because render_inputs.rs fail-closed on non-loopback http.
control_plane_url = "http://127.0.0.1:8787"
# The compose plane only speaks http on the in-cluster network; TLS
# terminates at Traefik for anything leaving the host boundary.
allow_insecure_http = true
render_inputs_dir = "/run/vrt/render-inputs"
token_file = "/run/vrt/secrets/cell-token"
health_listen = "127.0.0.1:9090"
metrics_listen = "127.0.0.1:9495"
poll_interval_secs = 10
cron_holder = "vrt-cell-controller"
fence_file = "/data/fence.json"
cron_state_dir = "/data"
replicas = 1
egress_required = false
trusted_keys = [
  { keyId = "__KEY_ID__", publicKey = "__PUBKEY__" },
]

# The d1sql endpoint validator accepts only loopback or
# `<svc>.<ns>.svc[.cluster.local]` — the compose alias on the vrt-sql
# service gives it exactly that shape.
[d1sql]
endpoint = "http://vrt-sql.openflare.svc:8082"
auth_secret_file = "/run/vrt/secrets/vrt-sql-auth-secret"
timeout_secs = 5
# Opt-in follower promote listener used by PROMOTE ops / auto-failover.
promote_endpoint = "http://vrt-sql-follower.openflare.svc:8092"

# Same RESP store as the provider's [kvrocks] (KV purge + data cell-ops).
[storage_purge.kvrocks]
urlEnv = "VRT_KVROCKS_URL"
timeoutMs = 5000
connectTimeoutMs = 5000

# R2 purge ops + capability — MUST mirror vrt-provider.toml [s3]
# (endpoint/bucket/env names in lockstep or purge and data diverge).
[storage_purge.s3]
endpoint = "http://silo.openflare.svc:9000"
region = "us-east-1"
bucket = "__R2_BUCKET__"
accessKeyEnv = "VRT_R2_BINDING_ACCESS_KEY"
secretKeyEnv = "VRT_R2_BINDING_SECRET_KEY"
multipartTtlMs = 604800000
conditionalWrites = true


# Workers Cache invalidation — the CACHE_PURGE fan-out executor. The
# token is the SAME secret vrt-host reads (VRT_CACHE_PURGE_TOKEN env in
# BOTH containers of this pod): the host mounts POST
# /internal/cache/purge on its loopback control listener only when it
# is set, and the controller reports cachePurge=true only when it can
# sign with the same value — one vrt-secrets key (cache-purge-token)
# serves both sides, never a half-wired purge path. Absent key => the
# host mounts no route and the controller wires no executor, so the
# capability simply stays off. Requires a cell image carrying
# openflare#170: ProdConfig is deny_unknown_fields, an older binary
# refuses this section at load (config and image advance together).
[cache_purge]
tokenEnv = "VRT_CACHE_PURGE_TOKEN"
timeoutMs = 5000

[[pods]]
id = "pod-0"
dir = "/run/vrt/pod-delivery"
readyz = "http://127.0.0.1:9091"
