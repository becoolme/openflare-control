services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vrt
      POSTGRES_PASSWORD: vrt
      POSTGRES_DB: vrt_plane
    ports: ['5432:5432']
    volumes: ['plane-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vrt -d vrt_plane']
      interval: 2s
      timeout: 3s
      retries: 30

  plane:
    build: { context: ., dockerfile: apps/plane/Dockerfile }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vrt:vrt@postgres:5432/vrt_plane
      PLANE_TOKEN: ${PLANE_TOKEN:?set PLANE_TOKEN}
      PLANE_ADMIN_TOKEN: ${PLANE_ADMIN_TOKEN:-}
      PLANE_SIGNING_SECRET: ${PLANE_SIGNING_SECRET:?set PLANE_SIGNING_SECRET}
      PLANE_BUNDLE_DIR: /data/bundles
      PORT: '8787'
    ports: ['8787:8787']
    volumes: ['plane-bundles:/data/bundles']

  console:
    build: { context: ., dockerfile: apps/console/Dockerfile }
    depends_on: [plane]
    environment:
      PLANE_URL: http://plane:8787
      PLANE_TOKEN: ${PLANE_TOKEN:?set PLANE_TOKEN}
      PLANE_ADMIN_TOKEN: ${PLANE_ADMIN_TOKEN:-}
      PORT: '8788'
    ports: ['8788:8788']

volumes:
  plane-db:
  plane-bundles:
