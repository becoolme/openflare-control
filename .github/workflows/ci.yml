name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm run typecheck
      - run: pnpm run check:package
      - run: pnpm run check:sanitized
      - run: PLANE_ADMIN_TOKEN=y PLANE_SIGNING_SECRET=zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz PLANE_SECRETS_KEY=k CONSOLE_AUTH_PASSWORD=c docker compose config -q

  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: contract
        run: echo "sha=$(cat OPENFLARE_CONTRACT_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: becoolme/openflare
          path: openflare
          ref: ${{ steps.contract.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The runtime owns the wire contract: fail if the vendored fixtures drifted.
      - run: OPENFLARE_DIR=openflare pnpm run check:openflare-contract
      - run: pnpm --filter openflare-control test:coverage
      # Integration: consume the packed artifact from an empty project.
      - run: pnpm run check:package-consumption

  plane:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vrt
          POSTGRES_PASSWORD: vrt
          POSTGRES_DB: openflare_plane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vrt" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openflare-control build
      - run: pnpm --filter openflare-plane build
      - name: Unit + Postgres conformance coverage
        env:
          DATABASE_URL: postgresql://vrt:vrt@127.0.0.1:5432/openflare_plane_test
        run: pnpm --filter openflare-plane test:coverage

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/plane/Dockerfile -t openflare-plane:ci .

  console:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vrt
          POSTGRES_PASSWORD: vrt
          POSTGRES_DB: openflare_plane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vrt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vrt:vrt@127.0.0.1:5432/openflare_plane_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The console e2e boots the real plane in-process, and plane imports
      # the control package — it must be built for the console lane to run it.
      - run: pnpm --filter openflare-control build
      # the browser e2e serves the built SPA — it must exist before tests run
      - run: pnpm --filter openflare-console build
      - run: pnpm --filter openflare-console exec playwright install --with-deps chromium
      - run: pnpm --filter openflare-console test
      - run: pnpm --filter openflare-console typecheck

  e2e-docker:
    runs-on: ubuntu-24.04
    env:
      PLANE_ADMIN_TOKEN: docker-e2e-admin-token-0123456789ab
      PLANE_SIGNING_SECRET: docker-e2e-signing-secret-0123456789
      PLANE_SECRETS_KEY: docker-e2e-secrets-key-0123456789
      CONSOLE_AUTH_PASSWORD: docker-e2e-console-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: docker compose up -d --build
      - run: node scripts/e2e-docker.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLANE_ADMIN_TOKEN: kind-e2e-admin-token-0123456789abcd
      PLANE_SIGNING_SECRET: kind-e2e-signing-secret-0123456789
      PLANE_SECRETS_KEY: kind-e2e-secrets-key-0123456789ab
      CONSOLE_AUTH_PASSWORD: kind-e2e-console-password
      KIND_CLUSTER: openflare-e2e
      PLANE_E2E_PORT: '18787'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: helm/kind-action@v1
        with:
          cluster_name: openflare-e2e
          wait: 120s
      - run: bash scripts/e2e-kind.sh

  # Real full-stack e2e: the management API uploads a runtime stored-document
  # bundle, a real cell-controller/vrt-host/workerd serves it, and the ingress
  # is asserted to return v1; a second deploy must serve v2. The runtime is
  # checked out at OPENFLARE_CONTRACT_REV (the same pin the contract gate uses).
  e2e-fullstack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vrt
          POSTGRES_PASSWORD: vrt
          POSTGRES_DB: openflare_plane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vrt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vrt:vrt@127.0.0.1:5432/openflare_plane_test
      PLANE_ADMIN_TOKEN: fullstack-admin-token-0123456789abcdef
      PLANE_SIGNING_SECRET: fullstack-signing-secret-0123456789abcdef
      PLANE_SECRETS_KEY: fullstack-secrets-key-0123456789abcdef
      RUNTIME_DIR: ${{ github.workspace }}/openflare
      WORKERD_BIN: ${{ github.workspace }}/openflare/.ci/workerd/workerd
      FACADE_DIR: ${{ github.workspace }}/openflare/facade
      VRT_HOST_BIN: ${{ github.workspace }}/openflare/target/debug/vrt-host
      CELL_CONTROLLER_BIN: ${{ github.workspace }}/openflare/target/debug/cell-controller
      VRT_PROVIDER_BIN: ${{ github.workspace }}/openflare/target/debug/vrt-provider
    steps:
      - uses: actions/checkout@v4
      - id: contract
        run: echo "sha=$(cat OPENFLARE_CONTRACT_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: becoolme/openflare
          path: openflare
          ref: ${{ steps.contract.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openflare-control build
      - run: pnpm --filter openflare-plane build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openflare
      - name: Build the cell controller and runtime host
        working-directory: openflare
        run: cargo build --locked -p cell-controller -p vrt-host -p vrt-provider --bins
      - name: Fetch the pinned workerd binary
        working-directory: openflare
        run: scripts/fetch-workerd.sh --out .ci/workerd --platform linux-x64
      - name: Apply the plane schema
        run: node apps/plane/dist/migrate.js
      - name: Full-stack upload → deploy → invoke → update
        run: node scripts/e2e-fullstack.mjs

  # All-in-one compose e2e: the whole stack (control plane + cell) really
  # comes up via docker compose — cell-init bootstrap, cell pull, deploy,
  # and an ingress invoke through the real workerd image.
  e2e-all-in-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLANE_ADMIN_TOKEN: aio-e2e-admin-token-0123456789abcdef
      PLANE_SIGNING_SECRET: aio-e2e-signing-secret-0123456789
      PLANE_SECRETS_KEY: aio-e2e-secrets-key-0123456789abcdef
      CONSOLE_AUTH_PASSWORD: aio-e2e-console-password
      POSTGRES_PASSWORD: aio-e2e-postgres-password
      REDIS_PASSWORD: aio-e2e-redis-password
      OPENFLARE_DIR: ${{ github.workspace }}/openflare
      VRT_CELL_ID: aio-e2e
      # CI exercises the source-build path: the dev override layers build
      # sections back onto the prebuilt base. Users ride the base alone.
      COMPOSE_FILE: docker-compose.all-in-one.yml:docker-compose.all-in-one.dev.yml
    steps:
      - uses: actions/checkout@v4
      - id: contract
        run: echo "sha=$(cat OPENFLARE_CONTRACT_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: becoolme/openflare
          path: openflare
          ref: ${{ steps.contract.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openflare-control build
      - name: Fetch the pinned workerd binary
        run: node scripts/vrt-fetch-workerd.mjs --arch linux-x64 | tee /dev/stderr | grep '^WORKERD_SHA256=' >> "$GITHUB_ENV"
      - run: docker compose up -d --build
      - run: node scripts/e2e-all-in-one.mjs
      - name: D1 failover drill (Docker)
        run: node scripts/e2e-d1-failover-docker.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  k8s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: becoolme/openflare
          path: openflare
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Overlay templates and the render gate behave
        env:
          OPENFLARE_DIR: openflare
        run: |
          node scripts/vrt-k8s-check.mjs --template deploy/k8s/overlays/example
          node --test scripts/test/*.test.mjs
