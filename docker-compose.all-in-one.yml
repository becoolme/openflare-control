# All-in-one — the whole platform on one Docker host:
# control plane (postgres + plane + console) AND one cell
# (vrt-host + cell-controller + vrt-provider + vrt-sql + redis KV).
# The management API is literally the control plane's — same code as
# the k8s layout — so the surface is identical in both deploys.
#
#   OPENFLARE_DIR=../openflare PLANE_ADMIN_TOKEN=<64hex> \
#   PLANE_SIGNING_SECRET=<seed> PLANE_SECRETS_KEY=<key> \
#   CONSOLE_AUTH_PASSWORD=<pw> docker compose \
#     -f docker-compose.all-in-one.yml up --build
#
# The cell images build from the sibling openflare checkout
# (OPENFLARE_DIR, the same convention scripts/vrt-build-images.sh uses).
# `cell-init` provisions the cell, issues its pull token, renders the
# service configs and seeds the shared secrets — all idempotent.
#
# Required secrets: PLANE_ADMIN_TOKEN, PLANE_SIGNING_SECRET, PLANE_SECRETS_KEY,
# CONSOLE_AUTH_PASSWORD, POSTGRES_PASSWORD, REDIS_PASSWORD (no defaults).
#
# TLS: `--profile tls` adds Traefik on :80/:443 — per-hostname LE certs
# at first handshake (Dokploy-style; VRT_TLS_EMAIL optional, enables
# expiry notices). Console on ${CONSOLE_HOST}, every
# worker hostname + preview subdomain terminates on vrt-host via the
# catch-all router. Without the profile: console/plane/ingress stay on
# their loopback ${*_BIND} ports (trusted-network dev mode).

name: openflare-all-in-one

x-vrt-cell: &vrt-cell
  user: '${VRT_UID:-10001}:${VRT_GID:-10001}'
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vrt
      # C1: no committed default. The control-plane DB is only reachable on
      # the `backend` network, never from the tenant data-plane network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vrt_plane
    volumes: ['plane-db:/var/lib/postgresql/data']
    networks: ['backend']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vrt -d vrt_plane']
      interval: 2s
      timeout: 3s
      retries: 30

  plane:
    image: openflare-plane:local
    build: { context: ., dockerfile: apps/plane/Dockerfile }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vrt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vrt_plane
      # M9: secrets arrive as files (compose secrets), never container env.
      PLANE_ADMIN_TOKEN_FILE: /run/secrets/plane_admin_token
      PLANE_SIGNING_SECRET_FILE: /run/secrets/plane_signing_secret
      PLANE_SECRETS_KEY_FILE: /run/secrets/plane_secrets_key
      PLANE_BUNDLE_DIR: /data/bundles
      PORT: '8787'
    secrets:
      - plane_admin_token
      - plane_signing_secret
      - plane_secrets_key
    ports: ['${PLANE_BIND:-127.0.0.1}:8787:8787']
    volumes: ['plane-bundles:/data/bundles']
    # C1: DB access on `backend`; Traefik/remote-cell access on `default`.
    networks: ['default', 'backend']
    healthcheck:
      # node:slim has no curl — use the runtime itself.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      # Remote cells pull desired-state/bundles over HTTPS here. Opt-in:
      # the default `api.invalid` TLD never resolves, so no route exists
      # until PLANE_API_HOST is set. /api/v1 wants PLANE_ADMIN_TOKEN and
      # /api/internal wants a per-cell token — bearer auth rides inside
      # TLS either way.
      traefik.enable: 'true'
      # M11: the public router serves ONLY the remote-cell API. The
      # management API (/api/v1) is never published: use the loopback
      # PLANE_BIND, or an explicit allowlist/mTLS reverse proxy in front.
      traefik.http.routers.plane-api.rule: Host(`${PLANE_API_HOST:-api.invalid}`) && PathPrefix(`/api/internal/`)
      traefik.http.routers.plane-api.entrypoints: websecure
      traefik.http.routers.plane-api.tls.certresolver: le
      traefik.http.services.plane-api.loadbalancer.server.port: '8787'

  console:
    build: { context: ., dockerfile: apps/console/Dockerfile }
    depends_on: [plane]
    environment:
      PLANE_URL: http://plane:8787
      # M9: file-backed secrets.
      PLANE_ADMIN_TOKEN_FILE: /run/secrets/plane_admin_token
      CONSOLE_AUTH_PASSWORD_FILE: /run/secrets/console_auth_password
      PORT: '8788'
    secrets:
      - plane_admin_token
      - console_auth_password
    ports: ['${CONSOLE_BIND:-127.0.0.1}:8788:8788']
    # C1: reaches the plane on `backend`; published by Traefik on `default`.
    networks: ['default', 'backend']
    labels:
      # Traefik (tls profile) publishes the management UI here.
      traefik.enable: 'true'
      traefik.http.routers.console.rule: Host(`${CONSOLE_HOST:-localhost}`)
      traefik.http.routers.console.entrypoints: websecure
      traefik.http.routers.console.tls.certresolver: le
      traefik.http.services.console.loadbalancer.server.port: '8788'

  # One-shot bootstrap: cell row + pull token + signing key + secrets +
  # rendered configs. Idempotent — never rotates existing files.
  cell-init:
    # Rebuilds the plane Dockerfile rather than reusing the plane service's
    # image: an image-only service triggers a registry pull before the
    # build completes; a second build section just hits the layer cache.
    image: openflare-cell-init:local
    build: { context: ., dockerfile: apps/plane/Dockerfile }
    user: '0:0'
    depends_on:
      plane:
        condition: service_healthy
    environment:
      PLANE_URL: http://plane:8787
      # M9: file-backed secrets.
      PLANE_ADMIN_TOKEN_FILE: /run/secrets/plane_admin_token
      PLANE_SIGNING_SECRET_FILE: /run/secrets/plane_signing_secret
      VRT_CELL_ID: ${VRT_CELL_ID:-local}
      # Trusted-XFF scope is the pinned Traefik address — nothing else on
      # the net is a legitimate proxy. Keep in sync with VRT_TRAEFIK_IP.
      VRT_TRUSTED_CIDR: ${VRT_TRUSTED_CIDR:-172.31.42.250/32}
      VRT_R2_BUCKET: ${VRT_R2_BUCKET:-vrt-r2}
    secrets:
      - plane_admin_token
      - plane_signing_secret
    volumes:
      - ./deploy/docker/all-in-one:/init:ro
      - cell-run:/run/vrt
      - cell-config:/etc/vrt
    # C1: bootstrap only talks to the plane (backend); no data-plane access.
    networks: ['backend']
    restart: 'no'
    entrypoint: ['node', '/init/init-cell.mjs']

  # ---- cell stack (same wiring as deploy/k8s/base, one container
  #      per workload; cell-controller shares vrt-host's netns because
  #      the FileEnvelopePodChannel contract requires loopback readyz) ----
  vrt-host:
    <<: *vrt-cell
    build:
      context: ${OPENFLARE_DIR:-../openflare}
      dockerfile: deploy/docker/Dockerfile.vrt-host
      args:
        WORKERD_SOURCE: ${WORKERD_SOURCE:-file}
        WORKERD_SHA256: ${WORKERD_SHA256:-}
        VRT_UID: ${VRT_UID:-10001}
        VRT_GID: ${VRT_GID:-10001}
    image: openflare-cell-host:local
    pull_policy: never
    entrypoint: ['/usr/local/bin/vrt-host', '--config', '/etc/vrt/vrt-host.toml']
    environment:
      # Workers Cache purge gate — same value in the cell-controller
      # service below (they share this netns; the host mounts
      # /internal/cache/purge on its loopback control listener only
      # when set). Dev-grade fixed value, override for anything real.
      VRT_CACHE_PURGE_TOKEN: ${VRT_CACHE_PURGE_TOKEN:-dev-cache-purge-token}
    ports: ['${VRT_BIND:-127.0.0.1}:8080:8080']
    volumes:
      - cell-run:/run/vrt
      - cell-config:/etc/vrt:ro
      - cell-data:/data
    depends_on:
      cell-init:
        condition: service_completed_successfully
      vrt-provider:
        condition: service_started
      vrt-sql:
        condition: service_started
    healthcheck:
      # M7: vrt-host binds the metrics listener BEFORE the initial-snapshot
      # wait (openflare #166), so a port probe is valid during the startup
      # race. Require PID 1 + the metrics socket + a live workerd child:
      # the socket distinguishes "waiting for the controller" from a crash,
      # and workerd appears only after desired arrives (real readiness).
      test:
        [
          'CMD-SHELL',
          "test -d /proc/1 && grep -Eq '^ *[0-9]+: 0100007F:2516 [0-9A-F:]+ 0A ' /proc/net/tcp && grep -q workerd /proc/[0-9]*/cmdline 2>/dev/null",
        ]
      interval: 5s
      timeout: 3s
      # Cold CI boots + first desired delivery can exceed one minute.
      retries: 24
      start_period: 20s

  cell-controller:
    <<: *vrt-cell
    build:
      context: ${OPENFLARE_DIR:-../openflare}
      dockerfile: deploy/docker/Dockerfile.cell-controller
    image: openflare-cell-controller:local
    pull_policy: never
    # Shares vrt-host's netns: [[pods]].readyz is loopback-only and the
    # delivery dir is on the shared cell-run volume.
    network_mode: 'service:vrt-host'
    environment:
      VRT_KVROCKS_URL: ${VRT_KVROCKS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379}
      VRT_R2_BINDING_ACCESS_KEY: ${VRT_R2_BINDING_ACCESS_KEY:-openflare-r2-binding}
      VRT_R2_BINDING_SECRET_KEY: ${VRT_R2_BINDING_SECRET_KEY:-openflare-r2-binding-secret}
      # Must equal the vrt-host service value — the fan-out executor
      # signs purge requests with it and the host accepts nothing else.
      VRT_CACHE_PURGE_TOKEN: ${VRT_CACHE_PURGE_TOKEN:-dev-cache-purge-token}
    volumes:
      - cell-run:/run/vrt
      - cell-config:/etc/vrt:ro
      - cell-cc-data:/data
    depends_on:
      vrt-host:
        # Not service_started: attaching a container to another's netns
        # races the target's exec — the ns only exists once its main
        # process runs.
        condition: service_healthy
      plane-loopback:
        # control_plane_url is loopback http through this forwarder.
        condition: service_started
    healthcheck:
      # L13: health_listen = 127.0.0.1:9090 (0x2382), same netns as vrt-host.
      test: ['CMD-SHELL', "grep -Eq '^ *[0-9]+: 0100007F:2382 [0-9A-F:]+ 0A ' /proc/net/tcp"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Loopback path to the plane for vrt-host: its config fail-closed on
  # non-loopback http control-plane URLs, and the compose-network
  # http://plane is neither https nor loopback. socat forwards
  # 127.0.0.1:8787 (inside vrt-host's netns) to the plane service.
  plane-loopback:
    <<: *vrt-cell
    image: alpine/socat:1.8.0.3
    network_mode: 'service:vrt-host'
    depends_on:
      vrt-host:
        condition: service_healthy
    command:
      - 'tcp-listen:8787,fork,reuseaddr,bind=127.0.0.1'
      - 'tcp:plane:8787'

  vrt-provider:
    <<: *vrt-cell
    build:
      context: ${OPENFLARE_DIR:-../openflare}
      dockerfile: deploy/docker/Dockerfile.vrt-provider
    image: openflare-cell-provider:local
    pull_policy: never
    entrypoint: ['/usr/local/bin/vrt-provider', '--config', '/etc/vrt/vrt-provider.toml']
    environment:
      VRT_KVROCKS_URL: ${VRT_KVROCKS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379}
      VRT_R2_BINDING_ACCESS_KEY: ${VRT_R2_BINDING_ACCESS_KEY:-openflare-r2-binding}
      VRT_R2_BINDING_SECRET_KEY: ${VRT_R2_BINDING_SECRET_KEY:-openflare-r2-binding-secret}
    volumes:
      - cell-run:/run/vrt
      - cell-config:/etc/vrt:ro
      - cell-data:/data:ro
    depends_on:
      cell-init:
        condition: service_completed_successfully
    healthcheck:
      # L13: pgProxy listener = 127.0.0.1:19543 (0x4C57). The provider has no
      # HTTP endpoint; this catches a dead listener without shell tooling.
      test: ['CMD-SHELL', "grep -Eq '^ *[0-9]+: 0100007F:4C57 [0-9A-F:]+ 0A ' /proc/net/tcp"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  vrt-sql:
    <<: *vrt-cell
    build:
      context: ${OPENFLARE_DIR:-../openflare}
      dockerfile: deploy/docker/Dockerfile.vrt-sql
    image: openflare-cell-sql:local
    pull_policy: never
    entrypoint: ['/usr/local/bin/vrt-sql', '--config', '/etc/vrt/vrt-sql.toml']
    volumes:
      - cell-run:/run/vrt:ro
      - cell-config:/etc/vrt:ro
      - cell-sql-data:/data
    networks:
      default:
        aliases: ['vrt-sql.openflare.svc']
    depends_on:
      cell-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # L13: listenTcp = 0.0.0.0:8082 (0x1F92).
      test: ['CMD-SHELL', "grep -Eq '^ *[0-9]+: 00000000:1F92 [0-9A-F:]+ 0A ' /proc/net/tcp"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Optional follower/premote listener for the D1 failover drill. The
  # config is written by scripts/e2e-d1-failover-docker.mjs after the
  # database id exists; starting it without that file exits closed.
  vrt-sql-follower:
    <<: *vrt-cell
    profiles: ['failover']
    image: openflare-cell-sql:local
    pull_policy: never
    entrypoint:
      ['/usr/local/bin/vrt-sql', 'follower', '--config', '/etc/vrt-follower/follower.toml']
    volumes:
      - cell-sql-data:/data
      - cell-run:/run/vrt:ro
      - ./.ci/d1-failover:/etc/vrt-follower:ro
    networks:
      default:
        aliases: ['vrt-sql-follower.openflare.svc']
    restart: 'no'

  redis:
    # RESP store backing the KV binding + purge ops (kvrocks-shaped).
    # M10: password-protected — every tenant KV lives here and the data-plane
    # network is reachable by a tenant escaping to the host container.
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ['kv-data:/data']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # redis-cli reads REDISCLI_AUTH, keeping the password out of argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save '' --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---- R2: bundled S3 object store (Silo — pgsty's maintained MinIO
  #      fork; upstream stopped shipping images). The .svc alias
  #      satisfies the cluster-internal-http rule — no TLS inside the
  #      compose net. Swap envs + endpoint for a real S3 in production.
  silo:
    image: ${S3_IMAGE:-pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${VRT_R2_ACCESS_KEY:-openflare-r2-access}
      MINIO_ROOT_PASSWORD: ${VRT_R2_SECRET_KEY:-openflare-r2-secret-012345}
    volumes: ['r2-data:/data']
    networks:
      default:
        aliases: ['silo.openflare.svc']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket create + scoped binding user — same image carries the
  # bundled mc client. Tenant bindings get VRT_R2_BINDING_* (an
  # s3:*-on-one-bucket user), never the root credentials: those stay in
  # silo-init so a leaked binding credential cannot list or delete other
  # tenants' buckets.
  silo-init:
    image: ${S3_IMAGE:-pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    restart: 'no'
    depends_on:
      silo:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${VRT_R2_ACCESS_KEY:-openflare-r2-access}
      MINIO_ROOT_PASSWORD: ${VRT_R2_SECRET_KEY:-openflare-r2-secret-012345}
      VRT_R2_BUCKET: ${VRT_R2_BUCKET:-vrt-r2}
      VRT_R2_BINDING_ACCESS_KEY: ${VRT_R2_BINDING_ACCESS_KEY:-openflare-r2-binding}
      VRT_R2_BINDING_SECRET_KEY: ${VRT_R2_BINDING_SECRET_KEY:-openflare-r2-binding-secret}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://silo.openflare.svc:9000
        "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$VRT_R2_BUCKET" &&
        printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$$VRT_R2_BUCKET\",\"arn:aws:s3:::$$VRT_R2_BUCKET/*\"]}]}" > /tmp/vrt-r2-binding.json &&
        (mc admin policy create local vrt-r2-binding /tmp/vrt-r2-binding.json || true) &&
        (mc admin user add local "$$VRT_R2_BINDING_ACCESS_KEY" "$$VRT_R2_BINDING_SECRET_KEY" || true) &&
        mc admin policy attach local vrt-r2-binding --user "$$VRT_R2_BINDING_ACCESS_KEY"

  # ---- public TLS entry (Dokploy-style) ----
  traefik:
    profiles: ['tls']
    image: ${TRAEFIK_IMAGE:-traefik:v3.3}
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # H3: never mount the raw Docker socket into the ACME-facing proxy.
      # A filtered read-only socket-proxy is the only Docker API access.
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${VRT_TLS_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.caserver=${VRT_TLS_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --api=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-WARN}
    ports:
      - '${VRT_TLS_BIND:-0.0.0.0}:80:80'
      - '${VRT_TLS_BIND:-0.0.0.0}:443:443'
    volumes:
      - ./deploy/docker/all-in-one/traefik:/dynamic:ro
      - traefik-acme:/acme
    # Pinned inside VRT_NET_SUBNET so vrt-host can trust X-Forwarded-For
    # from exactly this /32 — not the whole compose net, where any
    # container (or escaped tenant) could spoof client IPs.
    networks:
      default:
        ipv4_address: ${VRT_TRAEFIK_IP:-172.31.42.250}
      socketproxy: {}
    depends_on:
      console:
        condition: service_started
      vrt-host:
        condition: service_started
      docker-socket-proxy:
        condition: service_started

  # H3: read-only, filtered Docker API for Traefik. Only the endpoints the
  # docker provider needs are enabled; POST is disabled. The raw socket is
  # never mounted into an internet-facing container.
  docker-socket-proxy:
    profiles: ['tls']
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.2.0}
    restart: unless-stopped
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      INFO: '1'
      NETWORKS: '1'
      PING: '1'
      SERVICES: '1'
      TASKS: '1'
      VERSION: '1'
      POST: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: ['socketproxy']

secrets:
  # M9: sourced from the operator's host env at `compose up` time, but exposed
  # to containers as files under /run/secrets (not `docker inspect` env).
  plane_admin_token:
    environment: PLANE_ADMIN_TOKEN
  plane_signing_secret:
    environment: PLANE_SIGNING_SECRET
  plane_secrets_key:
    environment: PLANE_SECRETS_KEY
  console_auth_password:
    environment: CONSOLE_AUTH_PASSWORD

volumes:
  plane-db:
  plane-bundles:
  cell-run:
  cell-config:
  cell-data:
  cell-cc-data:
  cell-sql-data:
  kv-data:
  r2-data:
  traefik-acme:

networks:
  # H3: Traefik <-> docker-socket-proxy only. Internal: no egress, and no
  # tenant/cell container joins it.
  socketproxy:
    internal: true
  # C1: control-plane persistence network. `internal` blocks egress; only
  # postgres/plane/console/cell-init join it, so a tenant escaping the
  # cell netns cannot reach the control-plane database.
  backend:
    internal: true
  default:
    ipam:
      config:
        # Pinned so vrt-host's trustedXff CIDR stays valid — the init
        # renders VRT_TRUSTED_CIDR to this same value.
        - subnet: ${VRT_NET_SUBNET:-172.31.42.0/24}
